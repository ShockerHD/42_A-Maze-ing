[project]
name = "a-maze-ing"
version = "0.0.1"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
]

[dependency-groups]
dev = [
    "flake8",
    "mypy",
]

[tool.uv]
package = false

[tool.mypy]
# `mypy .` is fixed by the subject, so keep the exclusions here.
exclude = '(^|/)(\.venv|build|dist|mlx_CLXV)(/|$)'
plugins = ["pydantic.mypy"]
